# Local development database. Production is Supabase (ap-northeast-1);
# nothing here is ever deployed. Port 55432 avoids colliding with a
# system Postgres on the default 5432.
services:
  postgres:
    image: postgres:17-alpine
    container_name: commerce-ops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: commerce_ops
    ports:
      - "55432:5432"
    volumes:
      - commerce-ops-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d commerce_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  commerce-ops-db-data:
