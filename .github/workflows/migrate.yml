name: Migrate production database

# Applies pending Prisma migrations to Supabase after CI passes on main.
# Deliberately not part of the Vercel build: a preview deploy must never
# migrate production, and a failed migration must not break hosting.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: prisma migrate deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    env:
      # Session-mode pooler, NOT db.<ref>.supabase.co. The direct host resolves
      # IPv6-only and GitHub runners are IPv4-only, so the direct host is
      # unreachable from here. Migrations also cannot run through the
      # transaction pooler on 6543.
      DIRECT_URL: ${{ secrets.SUPABASE_MIGRATION_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail fast when the migration secret is missing
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "SUPABASE_MIGRATION_URL is not set in repository secrets." >&2
            echo "Set it to the Supabase session-mode pooler URL:" >&2
            echo "  postgresql://postgres.<ref>:<password>@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres" >&2
            exit 1
          fi

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy
